<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 32">
  <!-- Sleek tapered hull -->
  <path d="M2,12 L96,11 L104,16 L96,21 L2,20 Z" fill="#1A3F6F" stroke="#081C36" stroke-width="1"/>
  <!-- Hull keel -->
  <rect x="4" y="20" width="94" height="3" rx="1" fill="#0C2540"/>
  <!-- Deck -->
  <rect x="2" y="8" width="96" height="4" rx="1" fill="#163356" stroke="#081C36" stroke-width="0.5"/>
  <!-- Bridge (center-rear) -->
  <rect x="58" y="3" width="28" height="9" rx="2" fill="#1A3F6F" stroke="#081C36" stroke-width="0.7"/>
  <rect x="63" y="1" width="18" height="6" rx="1.5" fill="#2255A0"/>
  <!-- Mast -->
  <rect x="71" y="0" width="2" height="4" rx="1" fill="#3A80C0"/>
  <!-- Forward gun -->
  <rect x="18" y="6" width="18" height="6" rx="1.5" fill="#1A3F6F" stroke="#081C36" stroke-width="0.6"/>
  <!-- Gun barrel -->
  <rect x="30" y="8" width="12" height="2" rx="1" fill="#3A80C0"/>
  <!-- Torpedo tube hint -->
  <rect x="40" y="12" width="14" height="3" rx="1" fill="#163356"/>
  <!-- Bow wave -->
  <path d="M96,14 Q102,16 96,18" fill="none" stroke="#3A80C0" stroke-width="0.8" opacity="0.5"/>
</svg>
