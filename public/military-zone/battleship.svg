<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 32">
  <!-- Main hull - heavier, thicker profile -->
  <path d="M4,10 L130,10 L138,16 L130,22 L4,22 Z" fill="#1A3F6F" stroke="#081C36" stroke-width="1"/>
  <!-- Hull keel -->
  <rect x="6" y="22" width="126" height="3" rx="1" fill="#0C2540"/>
  <!-- Deck surface -->
  <rect x="2" y="7" width="132" height="4" rx="1" fill="#163356" stroke="#081C36" stroke-width="0.5"/>
  <!-- Bridge superstructure (center-right) -->
  <rect x="82" y="2" width="36" height="9" rx="2" fill="#1A3F6F" stroke="#081C36" stroke-width="0.8"/>
  <rect x="88" y="0" width="24" height="6" rx="1.5" fill="#2255A0"/>
  <!-- Mast -->
  <rect x="99" y="0" width="2" height="3" rx="1" fill="#3A80C0"/>
  <!-- Gun turret 1 (forward) -->
  <rect x="22" y="5" width="24" height="7" rx="2" fill="#1A3F6F" stroke="#081C36" stroke-width="0.7"/>
  <!-- Gun barrels 1 -->
  <rect x="38" y="7.5" width="14" height="2" rx="1" fill="#3A80C0"/>
  <rect x="38" y="10" width="12" height="2" rx="1" fill="#2A6099"/>
  <!-- Gun turret 2 (mid) -->
  <rect x="54" y="6" width="20" height="6" rx="2" fill="#1A3F6F" stroke="#081C36" stroke-width="0.7"/>
  <!-- Gun barrels 2 -->
  <rect x="66" y="8" width="12" height="2" rx="1" fill="#3A80C0"/>
  <!-- Hull reinforcement lines -->
  <line x1="8" y1="16" x2="128" y2="16" stroke="#2A6099" stroke-width="0.5" opacity="0.4"/>
</svg>
