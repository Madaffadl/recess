<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 32">
  <!-- Elliptical pressure hull -->
  <ellipse cx="52" cy="19" rx="50" ry="9" fill="#1A3F6F" stroke="#081C36" stroke-width="1"/>
  <!-- Hull top highlight -->
  <ellipse cx="52" cy="16" rx="44" ry="5" fill="#2255A0" opacity="0.4"/>
  <!-- Hull centerline -->
  <line x1="6" y1="19" x2="98" y2="19" stroke="#163356" stroke-width="1" opacity="0.6"/>
  <!-- Conning tower -->
  <rect x="38" y="6" width="28" height="13" rx="4" fill="#1A3F6F" stroke="#081C36" stroke-width="0.8"/>
  <rect x="43" y="3" width="18" height="9" rx="3" fill="#2255A0" stroke="#081C36" stroke-width="0.6"/>
  <!-- Periscope -->
  <rect x="51" y="0" width="2" height="5" rx="1" fill="#3A80C0"/>
  <!-- Dive planes (stern left) -->
  <path d="M8,17 L18,13 L18,21 Z" fill="#163356" stroke="#081C36" stroke-width="0.5"/>
  <!-- Propeller -->
  <circle cx="5" cy="19" r="4" fill="none" stroke="#2A6099" stroke-width="1.5"/>
  <line x1="5" y1="15" x2="5" y2="23" stroke="#2A6099" stroke-width="1"/>
  <line x1="1" y1="19" x2="9" y2="19" stroke="#2A6099" stroke-width="1"/>
  <!-- Rudder fins (bow right) -->
  <path d="M96,17 L102,13 L102,21 Z" fill="#163356" stroke="#081C36" stroke-width="0.5"/>
</svg>
